backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General Info"
        file: "_data/general.json"
        fields:
          - { label: "Business Name", name: "business_name", widget: "string", default: "Luminé Kennels" }
          - { label: "Tagline", name: "tagline", widget: "string", default: "Where Every Puppy Finds Their Family" }
          - { label: "Location / Address", name: "address", widget: "string", default: "South Africa" }
          - { label: "Phone / WhatsApp", name: "phone", widget: "string", default: "" }
          - { label: "Email Address", name: "email", widget: "string", default: "tippybarnardt@gmail.com" }
          - { label: "Instagram Handle", name: "instagram", widget: "string", default: "lumine_kennels" }
          - { label: "About Us Text", name: "about", widget: "text", default: "Luminé Kennels was founded on a simple belief: every puppy deserves the best possible start in life." }

      - name: "puppies"
        label: "Available Puppies"
        file: "_data/puppies.json"
        fields:
          - label: "Puppies"
            name: "list"
            widget: "list"
            fields:
              - { label: "Name / Litter Name", name: "name", widget: "string" }
              - { label: "Breed", name: "breed", widget: "select", options: ["Dachshund — Shorthair", "Dachshund — Longhair", "English Bulldog"] }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Status", name: "status", widget: "select", options: ["Available Now", "Reserved", "Coming Soon"] }
              - { label: "Price (optional)", name: "price", widget: "string", required: false }
