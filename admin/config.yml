backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Site Settings"
    files:

      - name: "general"
        label: "General Info"
        file: "_data/general.json"
        fields:
          - { label: "Business Name", name: "business_name", widget: "string", default: "Luminé Kennels" }
          - { label: "Hero Tagline (small text above heading)", name: "tagline", widget: "string", default: "South Africa's Finest Breeders" }
          - { label: "Hero Main Heading", name: "hero_title", widget: "string", default: "Where Every Puppy Finds Their Family" }
          - { label: "Hero Description", name: "hero_desc", widget: "text", default: "At Luminé Kennels, we raise SACBR-registered dachshunds and KUSA-registered English bulldogs with love, care, and the highest breeding standards." }
          - { label: "About Us Text", name: "about", widget: "text", default: "Luminé Kennels was founded on a simple belief: every puppy deserves the best possible start in life." }
          - { label: "Address / Location", name: "address", widget: "string", default: "South Africa" }
          - { label: "Phone / WhatsApp", name: "phone", widget: "string", default: "" }
          - { label: "Email Address", name: "email", widget: "string", default: "tippybarnardt@gmail.com" }
          - { label: "Instagram Handle (without @)", name: "instagram", widget: "string", default: "lumine_kennels" }

      - name: "stats"
        label: "About Section Stats"
        file: "_data/stats.json"
        fields:
          - { label: "Stat 1 Number", name: "stat1_num", widget: "string", default: "17+" }
          - { label: "Stat 1 Label", name: "stat1_label", widget: "string", default: "Happy Litters" }
          - { label: "Stat 2 Number", name: "stat2_num", widget: "string", default: "2" }
          - { label: "Stat 2 Label", name: "stat2_label", widget: "string", default: "Registered Breeds" }
          - { label: "Stat 3 Number", name: "stat3_num", widget: "string", default: "100%" }
          - { label: "Stat 3 Label", name: "stat3_label", widget: "string", default: "Health Checked" }
          - { label: "Stat 4 Number", name: "stat4_num", widget: "string", default: "SA" }
          - { label: "Stat 4 Label", name: "stat4_label", widget: "string", default: "Nationwide Delivery" }

      - name: "breeds"
        label: "Breed Descriptions"
        file: "_data/breeds.json"
        fields:
          - { label: "Dachshund Description", name: "dachshund_desc", widget: "text", default: "Playful, loyal, and endlessly curious. Our dachshunds come in both shorthair and longhair varieties, in a range of stunning colours." }
          - { label: "English Bulldog Description", name: "bulldog_desc", widget: "text", default: "Gentle giants with the sweetest souls. Our English Bulldogs are bred for excellent temperament, correct structure, and family compatibility." }

      - name: "testimonials"
        label: "Testimonials"
        file: "_data/testimonials.json"
        fields:
          - label: "Testimonials"
            name: "list"
            widget: "list"
            fields:
              - { label: "Customer Name & Location", name: "author", widget: "string" }
              - { label: "Review Text", name: "text", widget: "text" }
              - { label: "Star Rating", name: "stars", widget: "select", options: ["5", "4", "3"], default: "5" }

      - name: "puppies"
        label: "Available Puppies"
        file: "_data/puppies.json"
        fields:
          - label: "Puppies"
            name: "list"
            widget: "list"
            fields:
              - { label: "Name / Litter Name", name: "name", widget: "string" }
              - { label: "Breed", name: "breed", widget: "select", options: ["Dachshund — Shorthair", "Dachshund — Longhair", "English Bulldog"] }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Status", name: "status", widget: "select", options: ["Available Now", "Reserved", "Coming Soon"] }
              - { label: "Price (optional)", name: "price", widget: "string", required: false }
